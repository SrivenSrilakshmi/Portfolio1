apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-secured
  namespace: api-security-demo
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: api-rate-limit,api-jwt-auth
spec:
  rules:
  - host: api.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: echo
            port:
              number: 80
