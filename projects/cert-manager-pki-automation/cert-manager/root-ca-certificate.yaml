apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: portfolio-root-ca
  secretName: root-ca-keypair
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: bootstrap-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
